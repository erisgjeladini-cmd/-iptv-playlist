name: Update IPTV Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build playlist
        run: |
          python <<'PY'
          import urllib.request
          import re

          sources = [
              ("DE/AT/CH", "https://iptv-org.github.io/iptv/languages/deu.m3u"),
              ("AL/XK", "https://iptv-org.github.io/iptv/languages/sqi.m3u"),
          ]

          seen = set()
          output = ["#EXTM3U"]

          for prefix, url in sources:
              data = urllib.request.urlopen(
                  url, timeout=30
              ).read().decode("utf-8", "replace")

              lines = data.replace("\r", "").splitlines()
              i = 0

              while i < len(lines) - 1:
                  ext = lines[i].strip()

                  if not ext.startswith("#EXTINF:"):
                      i += 1
                      continue

                  stream = lines[i + 1].strip()
                  i += 2

                  if not stream or stream.startswith("#"):
                      continue

                  if "Geo-blocked" in ext or "Not 24/7" in ext:
                      continue

                  if stream in seen:
                      continue

                  seen.add(stream)

                  if 'group-title="' in ext:
                      ext = re.sub(
                          r'group-title="([^"]*)"',
                          lambda m: f'group-title="{prefix} | {m.group(1)}"',
                          ext,
                          count=1
                      )
                  else:
                      ext = ext.replace(
                          ",",
                          f' group-title="{prefix}",',
                          1
                      )

                  output.append(ext)
                  output.append(stream)

          with open("playlist.m3u", "w", encoding="utf-8") as f:
              f.write("\n".join(output) + "\n")

          print(f"Created {(len(output)-1)//2} channels")
          PY

      - name: Save playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add playlist.m3u

          git diff --cached --quiet || \
          git commit -m "Update IPTV playlist"

          git push
